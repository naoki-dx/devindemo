<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Web Chat</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #343541;
      color: #ececf1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #202123;
      border-bottom: 1px solid #4d4d4f;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #ececf1;
      cursor: pointer;
      font-size: 20px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .settings-btn:hover {
      background: #4d4d4f;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #202123;
      border-bottom: 1px solid #4d4d4f;
    }

    .tab {
      padding: 10px 24px;
      background: none;
      border: none;
      color: #8e8ea0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #ececf1;
    }

    .tab.active {
      color: #ececf1;
      border-bottom-color: #19c37d;
    }

    /* Documents panel */
    .docs-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .docs-content {
      max-width: 768px;
      margin: 0 auto;
    }

    .docs-content h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .docs-content p {
      font-size: 14px;
      color: #8e8ea0;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .upload-area {
      border: 2px dashed #4d4d4f;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      border-color: #19c37d;
      background: rgba(25, 195, 125, 0.05);
    }

    .upload-area .upload-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .upload-area .upload-text {
      font-size: 15px;
      color: #ececf1;
      margin-bottom: 4px;
    }

    .upload-area .upload-hint {
      font-size: 13px;
      color: #8e8ea0;
    }

    .doc-list {
      list-style: none;
    }

    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #40414f;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .doc-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .doc-item-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .doc-item-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-item-size {
      font-size: 12px;
      color: #8e8ea0;
    }

    .doc-item-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .doc-item-remove:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .doc-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(25, 195, 125, 0.1);
      border: 1px solid rgba(25, 195, 125, 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #19c37d;
    }

    /* Chat area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
    }

    .message-row {
      padding: 16px 20px;
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .message-row.assistant {
      background: #444654;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .message-row.user {
      margin-bottom: 8px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .avatar.user-avatar {
      background: #5436da;
    }

    .avatar.assistant-avatar {
      background: #19c37d;
    }

    .message-content {
      flex: 1;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing-indicator {
      display: inline-block;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Input area */
    .input-area {
      padding: 16px 20px;
      background: #343541;
      border-top: 1px solid #4d4d4f;
    }

    .input-wrapper {
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-wrapper textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #4d4d4f;
      border-radius: 8px;
      background: #40414f;
      color: #ececf1;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 200px;
      line-height: 1.5;
    }

    .input-wrapper textarea:focus {
      border-color: #8e8ea0;
    }

    .input-wrapper textarea::placeholder {
      color: #8e8ea0;
    }

    .send-btn {
      padding: 10px 20px;
      background: #19c37d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .send-btn:hover {
      background: #1a9d6a;
    }

    .send-btn:disabled {
      background: #4d4d4f;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #202123;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 480px;
      border: 1px solid #4d4d4f;
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .modal p {
      font-size: 13px;
      color: #8e8ea0;
      margin-bottom: 16px;
    }

    .modal label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #c5c5d2;
    }

    .modal input[type="password"],
    .modal select,
    .modal textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #4d4d4f;
      border-radius: 6px;
      background: #40414f;
      color: #ececf1;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    .modal input[type="password"]:focus,
    .modal select:focus,
    .modal textarea:focus {
      border-color: #8e8ea0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-actions button {
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }

    .btn-cancel {
      background: #4d4d4f;
      color: #ececf1;
    }

    .btn-save {
      background: #19c37d;
      color: white;
    }

    .btn-save:hover {
      background: #1a9d6a;
    }

    .btn-cancel:hover {
      background: #6b6b7b;
    }

    /* Welcome */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      color: #8e8ea0;
    }

    .welcome h2 {
      font-size: 28px;
      color: #ececf1;
      margin-bottom: 12px;
    }

    .welcome p {
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
    }

    /* Error */
    .error-msg {
      background: #ef4444;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 8px auto;
      max-width: 768px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [apiKey, setApiKey] = useState('');
      const [tempApiKey, setTempApiKey] = useState('');
      const [model, setModel] = useState('gpt-4o-mini');
      const [tempModel, setTempModel] = useState('gpt-4o-mini');
      const [systemPrompt, setSystemPrompt] = useState('');
      const [tempSystemPrompt, setTempSystemPrompt] = useState('');
      const [error, setError] = useState('');
      const [activeTab, setActiveTab] = useState('chat');
      const [documents, setDocuments] = useState([]);
      const fileInputRef = useRef(null);
      const chatEndRef = useRef(null);
      const textareaRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const autoResize = useCallback((el) => {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 200) + 'px';
      }, []);

      const openSettings = () => {
        setTempApiKey(apiKey);
        setTempModel(model);
        setTempSystemPrompt(systemPrompt);
        setShowSettings(true);
      };

      const saveSettings = () => {
        setApiKey(tempApiKey);
        setModel(tempModel);
        setSystemPrompt(tempSystemPrompt);
        setShowSettings(false);
      };

      const sendMessage = async () => {
        const text = input.trim();
        if (!text || loading) return;

        if (!apiKey) {
          setError('APIキーが設定されていません。右上の ⚙ アイコンからAPIキーを入力してください。');
          return;
        }

        setError('');
        const userMsg = { role: 'user', content: text };
        const newMessages = [...messages, userMsg];
        setMessages(newMessages);
        setInput('');
        setLoading(true);

        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
        }

        try {
          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`,
            },
            body: JSON.stringify({
              model: model,
              messages: (() => {
                const sysMsg = buildSystemMessage();
                return [
                  ...(sysMsg ? [{ role: 'system', content: sysMsg }] : []),
                  ...newMessages.map(m => ({ role: m.role, content: m.content })),
                ];
              })(),
            }),
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => null);
            const errMsg = errData?.error?.message || `APIエラー (${res.status})`;
            throw new Error(errMsg);
          }

          const data = await res.json();
          const assistantMsg = {
            role: 'assistant',
            content: data.choices[0].message.content,
          };
          setMessages([...newMessages, assistantMsg]);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setDocuments(prev => [...prev, {
              id: Date.now() + Math.random(),
              name: file.name,
              size: file.size,
              content: ev.target.result,
            }]);
          };
          reader.readAsText(file);
        });
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const removeDocument = (id) => {
        setDocuments(prev => prev.filter(d => d.id !== id));
      };

      const formatFileSize = (bytes) => {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      };

      const buildSystemMessage = () => {
        let msg = systemPrompt || '';
        if (documents.length > 0) {
          const docContext = documents.map(d => `--- ${d.name} ---\n${d.content}`).join('\n\n');
          const docInstruction = '以下のドキュメントの内容に基づいて回答してください。ドキュメントに記載のない情報については、その旨を伝えてください。';
          msg = msg
            ? `${msg}\n\n${docInstruction}\n\n${docContext}`
            : `${docInstruction}\n\n${docContext}`;
        }
        return msg;
      };

      return (
        <>
          {/* Header */}
          <div className="header">
            <h1>ChatGPT Web Chat</h1>
            <div className="header-right">
              {documents.length > 0 && (
                <span style={{ fontSize: '12px', color: '#19c37d' }}>📄 {documents.length}件</span>
              )}
              <button className="settings-btn" onClick={openSettings} title="設定">
                ⚙
              </button>
            </div>
          </div>

          {/* Tabs */}
          <div className="tabs">
            <button className={`tab ${activeTab === 'chat' ? 'active' : ''}`} onClick={() => setActiveTab('chat')}>💬 チャット</button>
            <button className={`tab ${activeTab === 'docs' ? 'active' : ''}`} onClick={() => setActiveTab('docs')}>📄 ドキュメント</button>
          </div>

          {/* Chat */}
          {activeTab === 'chat' ? (
          <div className="chat-container">
            {messages.length === 0 ? (
              <div className="welcome">
                <h2>ChatGPT Web Chat</h2>
                <p>
                  右上の ⚙ アイコンをクリックして OpenAI APIキーを設定してから、メッセージを入力してください。
                </p>
              </div>
            ) : (
              messages.map((msg, i) => (
                <div key={i} className={`message-row ${msg.role}`}>
                  <div className={`avatar ${msg.role}-avatar`}>
                    {msg.role === 'user' ? 'You' : 'AI'}
                  </div>
                  <div className="message-content">{msg.content}</div>
                </div>
              ))
            )}
            {loading && (
              <div className="message-row assistant">
                <div className="avatar assistant-avatar">AI</div>
                <div className="message-content">
                  <span className="typing-indicator">▋</span>
                </div>
              </div>
            )}
            {error && <div className="error-msg">{error}</div>}
            <div ref={chatEndRef} />
          </div>

          ) : (
          <div className="docs-panel">
            <div className="docs-content">
              <h2>📄 ドキュメント管理</h2>
              <p>
                テキストファイルをアップロードすると、AIがドキュメントの内容に基づいて回答します。
                対応形式: .txt, .md, .csv, .json, .xml, .html, .log
              </p>

              {documents.length > 0 && (
                <div className="doc-status">
                  📋 {documents.length}件のドキュメントが読み込まれています（チャット時に自動で参照されます）
                </div>
              )}

              <div
                className="upload-area"
                onClick={() => fileInputRef.current?.click()}
              >
                <div className="upload-icon">📁</div>
                <div className="upload-text">クリックしてファイルを選択</div>
                <div className="upload-hint">テキストファイル（.txt, .md, .csv 等）に対応</div>
              </div>
              <input
                ref={fileInputRef}
                type="file"
                accept=".txt,.md,.csv,.json,.xml,.html,.log,.yml,.yaml,.toml,.ini,.cfg,.conf"
                multiple
                onChange={handleFileUpload}
                style={{ display: 'none' }}
              />

              {documents.length > 0 && (
                <ul className="doc-list">
                  {documents.map(doc => (
                    <li key={doc.id} className="doc-item">
                      <div className="doc-item-info">
                        <span className="doc-item-icon">📄</span>
                        <div>
                          <div className="doc-item-name">{doc.name}</div>
                          <div className="doc-item-size">{formatFileSize(doc.size)}</div>
                        </div>
                      </div>
                      <button className="doc-item-remove" onClick={() => removeDocument(doc.id)} title="削除">✕</button>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          </div>
          )}

          {/* Input */}
          {activeTab === 'chat' && (
          <div className="input-area">
            <div className="input-wrapper">
              <textarea
                ref={textareaRef}
                rows="1"
                placeholder="メッセージを入力... (Shift+Enterで改行)"
                value={input}
                onChange={(e) => {
                  setInput(e.target.value);
                  autoResize(e.target);
                }}
                onKeyDown={handleKeyDown}
                disabled={loading}
              />
              <button className="send-btn" onClick={sendMessage} disabled={loading || !input.trim()}>
                送信
              </button>
            </div>
          </div>
          )}

          {/* Settings Modal */}
          {showSettings && (
            <div className="modal-overlay" onClick={() => setShowSettings(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <h2>⚙ 設定</h2>
                <p>APIキーはブラウザ内のメモリにのみ保存され、外部に送信されません（OpenAI API への通信のみ使用）。</p>

                <label>OpenAI APIキー</label>
                <input
                  type="password"
                  placeholder="sk-..."
                  value={tempApiKey}
                  onChange={(e) => setTempApiKey(e.target.value)}
                />

                <label>モデル</label>
                <select value={tempModel} onChange={(e) => setTempModel(e.target.value)}>
                  <option value="gpt-4o-mini">GPT-4o mini</option>
                  <option value="gpt-4o">GPT-4o</option>
                  <option value="gpt-4-turbo">GPT-4 Turbo</option>
                  <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                </select>

                <label>システムプロンプト</label>
                <textarea
                  rows="4"
                  placeholder="例: あなたは親切な日本語アシスタントです。"
                  value={tempSystemPrompt}
                  onChange={(e) => setTempSystemPrompt(e.target.value)}
                  style={{ resize: 'vertical', fontFamily: 'inherit' }}
                />

                <div className="modal-actions">
                  <button className="btn-cancel" onClick={() => setShowSettings(false)}>キャンセル</button>
                  <button className="btn-save" onClick={saveSettings}>保存</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
